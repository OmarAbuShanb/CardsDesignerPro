<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <circle cx="50" cy="40" r="30" fill="#4B90A5" />
    
    <!-- QR Code complexity -->
    <!-- Top-left eye -->
    <rect x="30" y="20" width="10" height="10" fill="#FFFFFF" />
    <rect x="32" y="22" width="6" height="6" fill="#4B90A5" />
    <rect x="34" y="24" width="2" height="2" fill="#FFFFFF" />
    
    <!-- Top-right eye -->
    <rect x="60" y="20" width="10" height="10" fill="#FFFFFF" />
    <rect x="62" y="22" width="6" height="6" fill="#4B90A5" />
    <rect x="64" y="24" width="2" height="2" fill="#FFFFFF" />
    
    <!-- Bottom-left eye -->
    <rect x="30" y="50" width="10" height="10" fill="#FFFFFF" />
    <rect x="32" y="52" width="6" height="6" fill="#4B90A5" />
    <rect x="34" y="54" width="2" height="2" fill="#FFFFFF" />
    
    <!-- Random bits -->
    <rect x="42" y="20" width="4" height="4" fill="#FFFFFF" />
    <rect x="48" y="20" width="10" height="4" fill="#FFFFFF" />
    <rect x="30" y="32" width="6" height="6" fill="#FFFFFF" />
    <rect x="38" y="34" width="8" height="4" fill="#FFFFFF" />
    <rect x="48" y="26" width="4" height="12" fill="#FFFFFF" />
    <rect x="54" y="32" width="6" height="16" fill="#FFFFFF" />
    <rect x="62" y="34" width="8" height="8" fill="#FFFFFF" />
    <rect x="42" y="40" width="10" height="6" fill="#FFFFFF" />
    <rect x="42" y="48" width="6" height="12" fill="#FFFFFF" />
    <rect x="50" y="50" width="20" height="6" fill="#FFFFFF" />
    <rect x="66" y="44" width="4" height="4" fill="#FFFFFF" />
    <rect x="60" y="58" width="10" height="2" fill="#FFFFFF" />

    <text x="50" y="85" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#F4BA46" text-anchor="middle">SCAN</text>
    <text x="50" y="100" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#4B90A5" text-anchor="middle">ME!</text>
</svg>
