<svg width="64" height="94" viewBox="0 0 64 94" xmlns="http://www.w3.org/2000/svg">
    <!-- Main circle -->
    <circle cx="32" cy="32" r="28" fill="#4B90A5" />

    <!-- QR white plate -->
    <rect x="14" y="14" width="36" height="36" rx="5" ry="5" fill="#FFFFFF" />

    <!-- QR Code -->
    <g transform="translate(17 17)" fill="#4B90A5" shape-rendering="crispEdges">
        <!-- Top-left eye -->
        <rect x="0" y="0" width="8" height="8" rx="1" />
        <rect x="2" y="2" width="4" height="4" fill="#FFFFFF" />
        <rect x="3" y="3" width="2" height="2" />

        <!-- Top-right eye -->
        <rect x="22" y="0" width="8" height="8" rx="1" />
        <rect x="24" y="2" width="4" height="4" fill="#FFFFFF" />
        <rect x="25" y="3" width="2" height="2" />

        <!-- Bottom-left eye -->
        <rect x="0" y="22" width="8" height="8" rx="1" />
        <rect x="2" y="24" width="4" height="4" fill="#FFFFFF" />
        <rect x="3" y="25" width="2" height="2" />

        <!-- Clean QR modules -->
        <rect x="11" y="0" width="3" height="3" />
        <rect x="16" y="0" width="3" height="3" />
        <rect x="11" y="5" width="8" height="3" />

        <rect x="0" y="11" width="3" height="3" />
        <rect x="5" y="11" width="3" height="3" />
        <rect x="11" y="11" width="3" height="8" />
        <rect x="16" y="11" width="3" height="3" />
        <rect x="22" y="11" width="8" height="3" />

        <rect x="0" y="16" width="8" height="3" />
        <rect x="16" y="16" width="8" height="3" />
        <rect x="27" y="16" width="3" height="8" />

        <rect x="11" y="22" width="3" height="3" />
        <rect x="16" y="22" width="3" height="8" />
        <rect x="22" y="22" width="3" height="3" />

        <rect x="11" y="27" width="3" height="3" />
        <rect x="22" y="27" width="8" height="3" />
    </g>

    <!-- Text -->
    <text
        x="10.5"
        y="74"
        font-family="Arial, sans-serif"
        font-weight="900"
        font-size="16"
        fill="#F4BA46"
        letter-spacing="0.5">SCAN</text>

    <text
        x="18.5"
        y="89"
        font-family="Arial, sans-serif"
        font-weight="900"
        font-size="16"
        fill="#4B90A5"
        letter-spacing="0.5">ME!</text>
</svg>